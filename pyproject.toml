[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncra"
version = "0.1.0"
description = "Synchrony-Guided Representation Alignment for omni-modal models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "numpy"]

[tool.setuptools.packages.find]
include = ["syncra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
